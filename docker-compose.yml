# Kinoandmebaasi arenduskeskkond: PostgreSQL + Django backend (migratsioonid ja seeder).
# Seaded loetakse failist .env (vt .env.example).
name: ta-andmebaas

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Puudub .env - kopeeri .env.example failiks .env}
      POSTGRES_USER: ${POSTGRES_USER:?Puudub .env - kopeeri .env.example failiks .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Puudub .env - kopeeri .env.example failiks .env}
    volumes:
      # Nimega volume: andmed jäävad alles ka siis, kui konteiner kustutatakse.
      - kino_pgdata:/var/lib/postgresql/data
      # Kontrollpäringud (scripts/kontroll.sql) on konteineris kättesaadavad ainult lugemiseks.
      - ./scripts:/scripts:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_HOST_PORT:-8001}:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Puudub .env - kopeeri .env.example failiks .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  kino_pgdata:
